# Optional public HTTPS reverse proxy. DNS and inbound ports 80/443 are required.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      READCORE_DOMAIN: ${READCORE_DOMAIN:?Set READCORE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - readcore
volumes:
  caddy-data:
  caddy-config:
