name: Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ReadCore-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ReadCore-Android-debug
      - uses: softprops/action-gh-release@v2
        with:
          files: app-debug.apk
          generate_release_notes: true
  signed_release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      READCORE_KEYSTORE_BASE64: ${{ secrets.READCORE_KEYSTORE_BASE64 }}
      READCORE_KEYSTORE_PASSWORD: ${{ secrets.READCORE_KEYSTORE_PASSWORD }}
      READCORE_KEY_ALIAS: ${{ secrets.READCORE_KEY_ALIAS }}
      READCORE_KEY_PASSWORD: ${{ secrets.READCORE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect signing configuration
        id: signing
        shell: bash
        run: |
          if [[ -n "$READCORE_KEYSTORE_BASE64" && -n "$READCORE_KEYSTORE_PASSWORD" && -n "$READCORE_KEY_ALIAS" && -n "$READCORE_KEY_PASSWORD" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            printf '%s' "$READCORE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/readcore.keystore"
            chmod 600 "$RUNNER_TEMP/readcore.keystore"
            echo "READCORE_KEYSTORE_PATH=$RUNNER_TEMP/readcore.keystore" >> "$GITHUB_ENV"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Release signing secrets are not all configured; debug APK only.'
          fi
      - uses: actions/setup-java@v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          gradle-version: '8.9'
      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          name: ReadCore-Android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: steps.signing.outputs.enabled == 'true'
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
